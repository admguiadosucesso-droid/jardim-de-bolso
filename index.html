<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jardim de Bolso · Guia Prático de Jardinagem e Paisagismo</title>
  
  <!-- SEO & PWA Meta Tags -->
  <meta name="description" content="Guia de bolso de jardinagem e paisagismo em formato de aplicativo. Consulta rápida de plantas, ferramentas, adubação e serviços por nível de experiência." />
  <meta name="theme-color" content="#1b4332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jardim de Bolso" />
  
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />

  <!-- Lucide Icons Premium Library -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Viewport Principal Estilo Mobile (Max 480px) -->
  <div id="app-viewport">
    
    <!-- Header Fixo Superior -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon" aria-hidden="true">
          <i data-lucide="sprout"></i>
        </div>
        <div>
          <h1 class="brand-title">Jardim de Bolso</h1>
          <span class="brand-tag">Guia Prático</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Pílula do Nível do Usuário -->
        <button id="user-level-pill" class="user-level-pill" title="Clique para alterar seu nível de experiência" aria-label="Alterar nível">
          <i data-lucide="user" class="pill-icon"></i>
          <span id="user-level-header-text">Iniciante</span>
        </button>
      </div>
    </header>

    <!-- Conteúdo Dinâmico das Telas (SPA) -->
    <main id="main-content" class="main-content" role="main">
      <!-- Injetado via app.js -->
    </main>

    <!-- Barra de Navegação Inferior Curvada com Bolinha Flutuante Deslizante Fluida -->
    <nav class="bottom-nav-wrapper" data-active-tab="inicio" role="navigation" aria-label="Navegação inferior principal">
      <!-- Fundo SVG Curvado Deslizante -->
      <div class="bottom-nav-bg-svg" aria-hidden="true">
        <svg preserveAspectRatio="none" viewBox="0 0 1434 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="nav-svg-path" d="M0 0 H645.406 C652.543 0 659.319 2.24039 663.941 6.12785 L684.094 23.0798 C703.008 38.9877 737.776 38.0034 754.871 21.0761 L768.873 7.21093 C773.446 2.68255 780.783 0 788.595 0 H1434 V80 H0 V0 Z" />
        </svg>
      </div>

      <!-- Bolinha Central Flutuante Deslizante -->
      <div class="floating-bubble" aria-hidden="true">
        <div class="fab-circle">
          <div class="fab-icon-layer">
            <i data-lucide="home" class="fab-morph-icon icon-inicio"></i>
            <i data-lucide="bookmark" class="fab-morph-icon icon-meujardim"></i>
            <i data-lucide="sliders-horizontal" class="fab-morph-icon icon-nivel"></i>
          </div>
          <span id="fav-count-badge" class="nav-badge-count" style="display: none;">0</span>
        </div>
      </div>

      <div class="bottom-nav-content">
        <button class="nav-tab-btn active" data-tab="inicio" aria-selected="true" aria-label="Ir para o Início">
          <span class="tab-icon"><i data-lucide="home"></i></span>
          <span class="tab-label">Início</span>
          <span class="tab-indicator"></span>
        </button>

        <button class="nav-tab-btn" data-tab="meujardim" aria-selected="false" aria-label="Ir para Meu Jardim">
          <span class="tab-icon">
            <i data-lucide="bookmark"></i>
            <span id="fav-count-badge-static" class="nav-badge-count" style="display: none;">0</span>
          </span>
          <span class="tab-label">Meu Jardim</span>
          <span class="tab-indicator"></span>
        </button>

        <button class="nav-tab-btn" data-tab="nivel" aria-selected="false" aria-label="Configurar Nível de Experiência">
          <span class="tab-icon"><i data-lucide="sliders-horizontal"></i></span>
          <span class="tab-label">Nível</span>
          <span class="tab-indicator"></span>
        </button>
      </div>
    </nav>

  </div>

  <!-- Toast Flutuante de Notificação -->
  <div id="toast-notice" class="toast-notice" role="status" aria-live="polite">
    <span id="toast-icon"><i data-lucide="check-circle-2"></i></span>
    <span id="toast-text">Item salvo com sucesso!</span>
  </div>

  <!-- Modal de Vídeo / Aviso Informativo -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.15rem; font-weight: 700;">Vídeo Demonstrativo</h3>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Fechar janela">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div id="modal-body">
        <!-- Conteúdo dinâmico do modal -->
      </div>
    </div>
  </div>

  <!-- Script Principal com Módulos ES6 -->
  <script type="module" src="./app.js"></script>

  <!-- Registro do Service Worker (PWA Offline) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.debug('SW registration skipped:', err);
        });
      });
    }
  </script>
</body>
</html>
